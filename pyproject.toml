[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "beyond-the-rules-pipeline"
version = "0.1.0"
description = "Rights-safe documentary production and YouTube publishing pipeline"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.4,<12",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
btr-produce = "btr_pipeline.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
